services:

  postgres:
    image: postgres:16-alpine
    container_name: smartplace-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: smartplace
      POSTGRES_USER: smartplace
      POSTGRES_PASSWORD: smartplace_dev

    ports:
      - "5432:5432"

    volumes:
      - smartplace_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U smartplace -d smartplace"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartplace_postgres_data:
