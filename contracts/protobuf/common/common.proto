syntax="proto3"

package smartplace.common.v1;

option java_multiple_files = true;
option java_package = "com.smartplace.contracts.common.v1";

message Empty {}

message RequestMetadata{
    string correlation_id = 1;
    string requested_by = 2;
}

message PageRequest {
    int32 page = 1;
    int32 size = 2;
}
messsage PageMetadata {
    int32 page = 1;
    int32 size = 2;
    int64 total_elements = 3;
    int32 total_pages = 4;
}